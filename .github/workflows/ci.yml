name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 为基础兼容版本；3.14 为最新实测版本
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装项目与开发依赖
        run: python -m pip install -e ".[dev]"

      - name: Ruff 代码检查
        run: ruff check .

      - name: 运行完整测试
        run: python -m pytest -q

      # 冒烟：真实启动应用（lifespan 会执行 Alembic 迁移）并检查健康接口
      - name: FastAPI /api/health 冒烟验证
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn-smoke.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "健康检查通过："
              curl -s http://127.0.0.1:8000/api/health
              exit 0
            fi
            sleep 1
          done
          echo "服务未在 30 秒内就绪，日志如下："
          cat uvicorn-smoke.log
          exit 1
