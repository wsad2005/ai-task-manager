# Docker Compose：一键启动（数据持久化在宿主机 ./data）。
# 使用前：在项目根目录 .env 中设置 SECRET_KEY（至少 32 字符）。
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      # SECRET_KEY 从项目根目录 .env 读取（compose 变量插值）
      SECRET_KEY: ${SECRET_KEY:?请先在 .env 中设置至少 32 字符的 SECRET_KEY}
      DATABASE_URL: sqlite:////app/data/app.db
      LOG_LEVEL: INFO
      # AI 功能（可选）：在 .env 中配置后取消注释
      # AI_BASE_URL: ${AI_BASE_URL}
      # AI_API_KEY: ${AI_API_KEY}
      # AI_MODEL: ${AI_MODEL}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
